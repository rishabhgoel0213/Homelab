# Copy this to /home/rishabh/.config/homelab/secrets.yaml and encrypt it with sops.
# Values below are examples only.

network-manager.env: |
  OPENWRT_WIFI_PSK=replace-me

cloudflare-dns.env: |
  CLOUDFLARE_DNS_API_TOKEN=replace-me

cloudflare-admin.env: |
  CLOUDFLARE_API_TOKEN=replace-me
  CLOUDFLARE_ACCOUNT_ID=replace-me
  CLOUDFLARE_ZONE_ID=replace-me
  CLOUDFLARE_ZONE=therealrishabh.com

cloudflared-tunnel.json: |
  {
    "AccountTag": "replace-me",
    "TunnelSecret": "replace-me",
    "TunnelID": "replace-me"
  }

tailscale-oauth.env: |
  TAILSCALE_OAUTH_CLIENT_ID=replace-me
  TAILSCALE_OAUTH_CLIENT_SECRET=replace-me
  TAILSCALE_OAUTH_READ_SCOPES='dns:read'
  TAILSCALE_OAUTH_WRITE_SCOPES='dns:write'
  TAILSCALE_TAILNET=-

codex-auth.json: |
  {
    "OPENAI_API_KEY": null
  }

codex-credentials.json: |
  {}

codex-beeper.env: |
  CODEX_BEEPER_TOKEN=replace-me
matrix-whatsapp-as-token: replace-with-a-random-token
matrix-registration-shared-secret: replace-with-a-random-token
matrix-whatsapp-hs-token: replace-with-a-different-random-token
matrix-whatsapp-pickle-key: replace-with-a-stable-random-key
matrix-imessage-as-token: replace-with-a-random-token
matrix-imessage-hs-token: replace-with-a-different-random-token
matrix-double-puppet-as-token: replace-with-a-random-token
matrix-double-puppet-hs-token: replace-with-a-different-random-token
matrix-double-puppet-sender-localpart: replace-with-a-random-localpart
matrix-pi-courier-access-token: replace-with-a-matrix-access-token
matrix-pi-courier-password: replace-with-a-long-random-password

remote-phone-token: replace-with-remote-phone-bearer-token

vaultwarden.env: |
  ADMIN_TOKEN=replace-with-argon2-token

samba-password: replace-with-long-random-password

restic-password: replace-with-long-random-password

restic-ssh-key: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  replace-with-restic-storage-box-private-key
  -----END OPENSSH PRIVATE KEY-----

restic-known-hosts: |
  [u123456.your-storagebox.de]:23 ssh-ed25519 replace-with-ssh-keyscan-output
