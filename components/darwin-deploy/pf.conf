#
# Default macOS PF configuration plus the managed Tailscale-only SSH anchor.
#

scrub-anchor "com.apple/*"
nat-anchor "com.apple/*"
rdr-anchor "com.apple/*"
dummynet-anchor "com.apple/*"
anchor "com.apple/*"
load anchor "com.apple" from "/etc/pf.anchors/com.apple"

anchor "com.rishabhgoel.tailscale-ssh"
load anchor "com.rishabhgoel.tailscale-ssh" from "/etc/pf.anchors/com.rishabhgoel.tailscale-ssh"
