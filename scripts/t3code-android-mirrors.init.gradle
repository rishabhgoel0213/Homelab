// Google Maven currently returns 404 for historical Android Gradle Plugin
// artifacts. Keep normal repositories, but add two established mirrors first.
def addAndroidMirrors = { repositories ->
  def googleGroups = { filter ->
    filter.includeGroupByRegex("com\\.android(\\..*)?")
    filter.includeGroupByRegex("androidx\\..*")
    filter.includeGroupByRegex("com\\.google\\.android.*")
    filter.includeGroupByRegex("com\\.google\\.firebase.*")
    filter.includeGroupByRegex("com\\.google\\.gms.*")
  }
  repositories.maven {
    url = uri("https://maven.aliyun.com/repository/google")
    content googleGroups
  }
  repositories.maven {
    url = uri("https://mirrors.cloud.tencent.com/nexus/repository/maven-public")
    content googleGroups
  }
}

settingsEvaluated { settings ->
  addAndroidMirrors(settings.pluginManagement.repositories)
  settings.pluginManagement.repositories.gradlePluginPortal()
  settings.pluginManagement.repositories.mavenCentral()
  settings.pluginManagement.repositories.google()
  addAndroidMirrors(settings.dependencyResolutionManagement.repositories)
}

allprojects {
  addAndroidMirrors(buildscript.repositories)
  addAndroidMirrors(repositories)
}
